services:
  - type: web
    name: interview-ai-pro-backend
    env: node
    rootDir: Backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_GENAI_API_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
